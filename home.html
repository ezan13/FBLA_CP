<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        .topBar {
            display: flex;
            text-align: center;
            background-color: blue;
            color: gold;
        }
        #accountName {
            margin: 0;
            margin-right: auto;
        }
        #tabName {
            margin: 0;
            margin-right: auto;
        }
        .menu {
            position: relative;
            display: inline-block;
            width: 100px;
            padding-top: 10px;
            padding-right:10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }

        .menuContent {
            display: none;
            position: absolute;
            top: 85%; 
            margin-top: 5px;
            background-color: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 10px;
            z-index: 1;
            border-radius: 4px;
        }
        .menu:hover .menuContent {
            display: block; 
        }
        .menuContent:hover .menuContent {
            display: block;
        }
        .menuButtons {
            margin-top: 5px;
            background-color: rgb(255,255,255);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .buttons{
            margin-top:100px;
            display: flex;
            align-items: center;
        }
        #newTransactionButton {
            background-color: gold;
            width: 48%;
            height: 200px;
            cursor: pointer;
        }
        #transactionHistoryButton {
            margin-left: 4%;
            background-color: gold;
            width: 48%;
            height: 200px;
            cursor: pointer;
        }
        .authorBox {
            margin-top: 80px;
        }
        
    </style>
</head>
<body>
    <div class="topBar">
        <h1 id="accountName">name</h1>
        <h1 id="tabName">Home</h1>
        <div class = "menu">
            --Menu--
            <div class="menuContent">
                <button class= "menuButtons" onclick="location.href='accountInfo.html'">Account Info</button>
                <button class= "menuButtons" onclick="location.href='index.html'">Log Out</button>
            </div>
        </div>
        
    </div>
    <div class = "buttons">
        <button id = "newTransactionButton" onclick="location.href='newTransaction.html'">
            <h1>New Transaction</h1>
        </button>
        <button id = "transactionHistoryButton" onclick="location.href='transactionHistory.html'">
            <h1>Transaction History</h1>
        </button>
    </div>
    <div class="authorBox">
        <h1>Fumakeya Banking Log Association</h1>
        <h2>About the Creator</h2>
        <h3>Creator: Ezan Fumakeya</h3>
        <h4>Hey everyone! My name is Ezan Fumakeya and I founded the Fumakeya Banking Log Association. I am a junior at 
            Jordan High School in Katy, Texas and am 16 years old. </h4>
    </div>
    
    
    
</body>
</html>
